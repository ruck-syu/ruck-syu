<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>2048 — Wish</title>
  <meta name="description" content="A small 2048 game by Wish." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="back" href="https://github.com/ruck-syu">← back to profile</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">☀</button>
    </header>

    <section class="hero">
      <div>
        <h1>2048<span>.</span></h1>
        <p class="tagline">merge tiles, keep it together.</p>
      </div>
      <div class="scores">
        <div class="score"><span>score</span><strong id="score">0</strong></div>
        <div class="score"><span>best</span><strong id="best">0</strong></div>
      </div>
    </section>

    <div class="controls">
      <button class="btn primary" id="new-game" type="button">New game</button>
      <button class="btn ghost" id="undo" type="button" disabled>Undo</button>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="application" aria-label="2048 game board"></div>
      <div class="overlay" id="overlay" hidden>
        <h2 id="overlay-title"></h2>
        <p id="overlay-sub"></p>
        <div class="overlay-actions">
          <button class="btn primary" id="keep-going" type="button" hidden>Keep going</button>
          <button class="btn ghost" id="retry" type="button">Try again</button>
        </div>
      </div>
    </div>

    <p class="hint">Arrow keys · WASD · swipe</p>

    <footer class="footer">
      <span>Built by Wish.</span>
      <a href="https://github.com/ruck-syu">github.com/ruck-syu</a>
    </footer>
  </main>

  <script src="./game.js"></script>
</body>
</html>
